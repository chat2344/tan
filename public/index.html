<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#008069">
<meta name="robots" content="noindex,nofollow">
<title>Notas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📝%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="auth" class="auth">
  <form id="authForm" class="card" autocomplete="on">
    <div class="logo">💬</div>
    <h1>Mensajes</h1>
    <p class="sub">Entra con tu usuario o crea una cuenta nueva.</p>
    <div class="seg">
      <button type="button" data-mode="login" class="on">Entrar</button>
      <button type="button" data-mode="register">Crear cuenta</button>
    </div>
    <input id="u" placeholder="Nombre de usuario" autocomplete="username" autocapitalize="none" required>
    <input id="p" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <p id="authErr" class="err"></p>
    <button class="primary" id="authBtn">Entrar</button>
  </form>
</section>

<div id="app" class="app hidden">
  <aside id="side">
    <header class="top">
      <h1>Chats</h1>
      <button id="menuBtn" class="icon" title="Menú">⋮</button>
    </header>
    <nav class="tabs">
      <button data-tab="chats" class="on">CHATS</button>
      <button data-tab="requests">SOLICITUDES<span class="badge hidden" id="reqBadge"></span></button>
      <button data-tab="add">AÑADIR</button>
    </nav>
    <div id="list"></div>
    <button id="fab" class="fab" title="Añadir amigo">💬</button>
  </aside>

  <main id="main">
    <div id="empty" class="empty"><div class="logo">💬</div><h2>Mensajes</h2><p>Elige un chat para empezar a escribir.</p></div>
    <section id="room" class="room hidden">
      <header class="top">
        <button id="back" class="icon">←</button>
        <div class="av" id="rAv"></div>
        <div class="grow" id="rHead"><b id="rName"></b><small id="rSub"></small></div>
        <button id="moreBtn" class="icon" title="Más">⋮</button>
      </header>
      <div id="msgs" class="msgs"></div>
      <div id="emojis" class="emojis hidden"></div>
      <form id="form" class="composer">
        <div class="pill">
          <button type="button" id="emojiBtn" class="ib" title="Emojis">😊</button>
          <input id="text" placeholder="Mensaje" autocomplete="off">
          <button type="button" id="clipBtn" class="ib" title="Adjuntar">📎</button>
          <button type="button" id="camBtn" class="ib" title="Cámara">📷</button>
        </div>
        <button class="send" title="Enviar">➤</button>
      </form>
      <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
      <input type="file" id="fileGal" accept="image/*" multiple hidden>
    </section>
  </main>
</div>

<div id="sheet" class="sheet hidden">
  <div class="scrim" id="scrim"></div>
  <div class="panel"><h3 id="sheetTitle"></h3><div id="sheetBody"></div></div>
</div>
<div id="toast" class="toast hidden"></div>

<div id="viewer" class="viewer hidden">
  <div class="vbar"><button id="vClose" class="icon" title="Cerrar">✕</button><a id="vDl" class="icon" title="Descargar" download="imagen">⬇</a></div>
  <img id="vImg" alt="Imagen ampliada">
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
